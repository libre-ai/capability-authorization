# Base dependency policy of the constellation (decisions Y43-Y46, 2026-10-09).
# Every Rust repository of libre-ai carries this file unchanged and executes
# `bans`, `licenses` and `sources` with cargo-deny from its required check.
# The licence allowlist is the inbound policy of ADR-0042 §4 and §11; GPL
# (linked), AGPL and SSPL are refused by omission.
#
# `[advisories]` is NOT part of the required verdict (I-26, Y44): an advisory
# verdict depends on the RustSec database of the day, so a fleet advisory
# control notifies without blocking. The section is kept for that control and
# for manual runs (`cargo deny check advisories`), which also apply
# `yanked = "deny"`.
#
# `[sources.allow-org] github = ["libre-ai"]` bounds git-dep trust to the
# organisation (ADR-0020 §2.5). `allow-wildcard-paths` admits the version-less
# `path` (and organisation `git`) dependencies between private workspace
# crates; a registry dependency declared as `*` stays refused by
# `wildcards = "deny"`, and so does any path dependency of a publishable crate.

[graph]
all-features = true

[advisories]
yanked = "deny"
# Stated, not inherited: cargo-deny 0.22.0 narrowed its default scope for
# unmaintained-crate advisories from `all` to `workspace` (direct dependencies
# of workspace crates only). `all` is what 0.19.5, the version this file was
# written for, applied when the key was absent; writing it keeps unmaintained
# advisories reported on the whole graph whichever version reads this file.
# It covers `unmaintained` only: `unsound` is not written here and stays at
# its default, `workspace` under both versions.
unmaintained = "all"
# Owner decision 2026-11-24 (ADVISORY-WAIVER-POLICY.md of libre-ai/project-governance):
# an advisory with no stable upstream fix is waived with a date and a record,
# never silenced. The review anchor is the day the list was read against the
# resolved graph (`cargo deny check advisories`, cargo-deny 0.19.5).
# waiver-review-anchor: 2026-11-24
ignore = [
  "RUSTSEC-2026-0387", # crypto-bigint 0.5.5 timing variability, fixed in >=0.7.6, but elliptic-curve 0.13.8 requires crypto-bigint ^0.5 and the vendored biscuit-auth 6.0.0 requires p256 ^0.13.2 and ecdsa ^0.16.9; only biscuit-auth 7.0.0-alpha releases accept the 0.14 line, no alpha adopted; expires=2027-02-24; ref=https://rustsec.org/advisories/RUSTSEC-2026-0387
]

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# The allowlist governs inbound dependencies only: the workspace's own private
# crates carry the outbound licences of the repository (REUSE.toml), which
# `private.ignore` keeps out of this check. LGPL is not admitted: Cargo links
# statically, and ADR-0042 §4 admits LGPL only where dynamic linking applies.
private = { ignore = true }
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  # Apache-2.0 plus an additional permission (ADR-0042 §11, Y45); carried by
  # `ar_archive_writer`, a build dependency of `psm` through `sqlparser`.
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  # OSI-approved permissive licenses required by the pinned JSON Schema toolchain.
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
github = ["libre-ai"]
