freshness:
  last_verified_on: "2026-07-30"
scope_stability: stable
benchmark:
  none: "n/a (shared brick, no external parity target)"
phases:
  - id: service
    title: En service dans la constellation
    exit_criteria:
      - id: consumed-pinned
        text: "La crate est consommée par les surfaces qui la déclarent ; ses six politiques datalog vendorées sont vérifiées byte-exactes contre l'autorité contracts."
        weight: 1
        status: accepted
        evidence:
          date: "2026-07-29"
          reference: "gate-acceptance-log 2026-07-29 (ligne 3.4), PRs hub #279-#283"
      - id: compat-policy
        text: >-
          La rupture est mécanique sur les trois surfaces que les consommateurs épinglent. Deux sont
          à outiller : un instantané versionné de la surface publique réexportée par src/lib.rs, et
          la liste exhaustive des six codes canoniques de AuthzError, tous deux comparés par
          cargo test --locked — qui doit échouer si un symbole disparaît, est ajouté ou change de
          signature, ou si un code disparaît ou change de valeur, sans montée conjointe de la
          version de la crate et entrée au journal des ruptures. La troisième est déjà fermée :
          bun run check:schemas échoue lorsqu'une des six politiques datalog dévie de l'autorité
          contracts épinglée. Fermé le jour où les deux ruptures de surface, rejouées séparément,
          font échouer cargo test --locked.
        weight: 1
        status: pending
